<section class="auth-form">
  <h2>Crear una cuenta</h2>

  @if (errorMessage()) {
    <p class="auth-form__aviso">{{ errorMessage() }}</p>
  }

  @if (errorEntries().length) {
    <ul class="auth-form__aviso">
      @for (entry of errorEntries(); track entry.label) {
        @for (message of entry.messages; track message) {
          <li>{{ entry.label }} {{ message }}</li>
        }
      }
    </ul>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Nombre <span class="auth-form__opcional">(opcional)</span>
      <input formControlName="name" autocomplete="name" />
    </label>

    <label>
      Correo
      <input type="email" formControlName="email" autocomplete="email" />
      @if (errorFor('email'); as message) {
        <small class="auth-form__error">{{ message }}</small>
      }
    </label>

    <label>
      Contrasena
      <input type="password" formControlName="password" autocomplete="new-password" />
      @if (errorFor('password'); as message) {
        <small class="auth-form__error">{{ message }}</small>
      }
    </label>

    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Creando...' : 'Crear cuenta' }}
    </button>
  </form>

  <p class="auth-form__alterno">Ya tienes cuenta? <a routerLink="/login">Iniciar sesion</a></p>
</section>
