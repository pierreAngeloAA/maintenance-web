<section class="auth-form">
  <h2>Iniciar sesion</h2>

  @if (errorMessage()) {
    <p class="auth-form__aviso">{{ errorMessage() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Correo
      <input type="email" formControlName="email" autocomplete="email" />
      @if (errorFor('email'); as message) {
        <small class="auth-form__error">{{ message }}</small>
      }
    </label>

    <label>
      Contrasena
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (errorFor('password'); as message) {
        <small class="auth-form__error">{{ message }}</small>
      }
    </label>

    <button type="submit" [disabled]="saving()">
      {{ saving() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <p class="auth-form__alterno">
    Todavia no tienes cuenta? <a routerLink="/register">Crear una cuenta</a>
  </p>
</section>
